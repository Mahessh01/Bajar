{% extends 'base.html' %}


{% block content %}

<section class="section-conten padding-y bg">

    <div class="container">
        <div class="row">
            <aside class="col-md-3">
                <!--   SIDEBAR   -->
                <ul class="list-group">
                    <a class="list-group-item active" href="#">Dashboard</a>
                    <a class="list-group-item" href="{% url 'cart' %}">My orders</a>
                    <a class="list-group-item" href="#">Edit Profile</a>
                    <a class="list-group-item" href="#">Settings </a>
                    <a class="list-group-item" href="#">Change Password</a>
                    <a class="list-group-item" href="#"> Received orders </a>
                </ul>
                <br>
                <a class="btn btn-light btn-block" href="{% url 'login' %}"> <i class="fa fa-power-off"></i> <span
                        class="text">Log
                        out</span> </a>
                <!--   SIDEBAR .//END   -->
            </aside>
            <main class="col-md-9">
                <article class="card" style="text-align: center;">
                    <header class="card-header">
                        <strong class="d-inline-block mr-3">Logged in as:</strong>
                        <span>{{ user.first_name }} {{ user.last_name }}</span>
                    </header>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="card" style="text-align: center;">
                                    <div class="card-body">
                                        <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Avatar"
                                            width="50" height="50" style="border-radius:50%;">
                                        <p class="mb-0">{{ user.email }}</p>
                                        <p>{{ user.phone_number }}</p>


                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">Total Orders</h5>
                                        <h4>{{ total_quantity }}</h4> 
                                        <a href="{% url 'cart' %}">view orders</a>
                                    </div>
                                </div>
                            </div>

                        </div> <!-- row.// -->
                    </div> <!-- card-body .// -->
                </article> <!-- order-group.// -->
            </main>
        </div> <!-- row.// -->
    </div>


</section>

{% endblock %}
